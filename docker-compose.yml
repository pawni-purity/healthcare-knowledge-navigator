version: '3.8'

services:
  # 1. FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clinical-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://clinical_admin:clinical_secure_password@postgres:5432/healthcare_navigator
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=clinical_knowledge_chunks
      - EMBEDDING_MODEL_NAME=BAAI/bge-large-en-v1.5
      - EMBEDDING_DIMENSION=1024
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend

  # 2. Relational database for metadata, sessions, and audits
  postgres:
    image: postgres:15-alpine
    container_name: clinical-postgres
    environment:
      POSTGRES_USER: clinical_admin
      POSTGRES_PASSWORD: clinical_secure_password
      POSTGRES_DB: healthcare_navigator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_admin -d healthcare_navigator"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Vector Database for dense embedding search
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: clinical-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 4. Lexical Database for BM25 search
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: clinical-opensearch
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 5. Redis for Celery Broker & Caching
  redis:
    image: redis:7-alpine
    container_name: clinical-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  opensearch_data:
  redis_data:
